name: fluxer_app
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  cached_network_image_ce: ^4.6.4
  cupertino_icons: ^1.0.8
  fluxer_captcha:
    path: fluxer_captcha
  fluxer_markdown:
    path: fluxer_markdown
  dio: ^5.7.0
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_riverpod: ^3.2.1
  highlight: ^0.7.0
  flutter_svg: ^2.2.4
  fluxer_dart:
    path: dart_sdk
  go_router: ^17.2.1
  google_fonts: ^8.0.1
  livekit_client: ^2.7.0
  flutter_background: ^1.3.1
  lucid_validation: ^1.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  package_info_plus: ^9.0.0
  passkeys: ^2.18.0
  phosphor_flutter: ^2.1.0
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  web_socket_channel: ^3.0.2
  window_manager: ^0.5.1
  talker: ^5.1.15
  talker_dio_logger: ^5.1.15
  app_links: ^7.0.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  url_launcher: ^6.3.2
  youtube_explode_dart: ^3.0.5
  flutter_thumbhash: ^0.1.0+1
  skeletonizer: ^2.1.3
  permission_handler: ^12.0.1
  file_picker: ^11.0.2
  crop_your_image: ^2.0.0

dependency_overrides:
  device_info_plus: ^12.4.0

dev_dependencies:
  accessibility_radar: ^0.3.0
  build_runner: ^2.12.2
  drift_dev: ^2.31.0
  flutter_test:
    sdk: flutter
  lint_hard: ^7.1.2
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/images/icons/
    - assets/images/badges/
    - assets/images/connections/
    - assets/emojis.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
