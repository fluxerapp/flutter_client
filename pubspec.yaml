name: fluxer_app
description: "A new Flutter project."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  app_badge_plus: ^1.3.0
  app_links: ^7.2.0
  audioplayers: ^6.8.1
  cached_network_image_ce: ^4.6.4
  clock: ^1.1.2
  connectivity_plus: ^7.1.1
  crop_your_image: ^2.0.0
  cross_file: ^0.3.5+2
  cupertino_icons: ^1.0.8
  desktop_drop: ^0.7.1
  device_info_plus: ^12.4.0
  dio: ^5.7.0
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  file_picker: ^11.0.2
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_background: ^1.3.1
  flutter_callkit_incoming: ^3.1.3
  flutter_highlight: ^0.7.0
  flutter_inappwebview: ^6.2.0-beta.3
  flutter_local_notifications: ^22.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.2.4
  flutter_thumbhash: ^0.1.0+1
  flutter_web_auth_2: ^5.0.3
  flutter_webrtc: ^1.5.2
  fluxer_captcha:
    path: packages/fluxer_captcha
  fluxer_dart:
    path: dart_sdk
  fluxer_markdown:
    path: packages/fluxer_markdown
  go_router: ^17.2.1
  google_fonts: ^8.0.1
  highlight: ^0.7.0
  image: ^4.8.0
  image_picker: ^1.2.2
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.11.1
  intl: ^0.20.2
  livekit_client: ^2.8.1
  lucid_validation: ^1.3.1
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  opentelemetry: ^0.18.11
  package_info_plus: ^9.0.0
  passkeys: ^2.21.1
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  phosphor_flutter:
    git:
      url: https://github.com/Niural/phosphor_flutter
  protobuf: ^6.0.0
  record: ^7.1.1
  riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  scrollview_observer: ^1.27.0
  shared_preferences: ^2.5.3
  skeletonizer: ^2.1.3
  super_clipboard: ^0.9.1
  talker: ^5.1.17
  talker_dio_logger: ^5.1.17
  talker_flutter: 5.1.16
  unifiedpush: ^6.2.0
  unifiedpush_ui: ^0.2.0
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  visibility_detector: ^0.4.0+2
  web_socket_channel: ^3.0.2
  window_manager: ^0.5.1
  youtube_explode_dart: ^3.1.0
  gaimon: ^1.4.3
  flutter_staggered_grid_view: ^0.7.0 # Would like to replace this package at some point (only used on Desktop)

dependency_overrides:
  analyzer: ^10.0.0
  dart_style: 3.1.7
  device_info_plus: ^12.4.0
  # pinned: mockito >=5.6.5 needs analyzer ^13, incompatible with the analyzer 10 override above;
  # it is an unused transitive dep of riverpod_generator, but build_runner still compiles its builder.
  mockito: 5.6.4

dev_dependencies:
  accessibility_radar: ^0.3.0
  build_runner: ^2.15.0
  drift_dev: ^2.31.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  lint_hard: ^7.1.2
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3
  test: ^1.31.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - assets/images/icons/
    - assets/images/icons/channels/
    - assets/images/badges/
    - assets/images/connections/
    - assets/emojis.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
