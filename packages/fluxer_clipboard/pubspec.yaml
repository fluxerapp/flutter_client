name: fluxer_clipboard
description: Reads files, images and text from the system clipboard.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.fluxer.clipboard
        pluginClass: FluxerClipboardPlugin
      ios:
        pluginClass: FluxerClipboardPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FluxerClipboardPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: FluxerClipboardPluginCApi
      linux:
        pluginClass: FluxerClipboardPlugin

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  pigeon: ^27.3.2
