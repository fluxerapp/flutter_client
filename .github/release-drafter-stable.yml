name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
tag-prefix: v
commitish: stable
filter-by-commitish: true
include-pre-releases: true
pull-request-limit: 100
latest: true

exclude-contributors:
  - dependabot
  - dependabot[bot]
  - renovate
  - renovate[bot]
  - renovate-bot
  - github-actions
  - github-actions[bot]
  - fluxer-automation
  - fluxer-automation[bot]

exclude-labels:
  - skip-changelog

version-resolver:
  major:
    labels:
      - breaking
  minor:
    labels:
      - feature
      - enhancement
  patch:
    labels:
      - fix
      - bug
  default: patch

categories:
  - title: Features
    labels:
      - feature
      - enhancement

  - title: Fixes
    labels:
      - fix
      - bug

  - title: Other

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&'

template: |
  ## What's New

  > Add custom changelog notes here! (remove this text)

  ## Detailed changes

  $CHANGES
