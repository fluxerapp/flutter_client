name: Stable Release (iOS)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  draft-release:
    name: Draft stable release
    uses: ./.github/workflows/_draft-stable-release.yml
    secrets: inherit

  # ios-app-store:
  #   name: iOS App Store build
  #   needs: draft-release
  #   uses: ./.github/workflows/ios-production-release.yml
  #   secrets: inherit

  ios-altstore-pal:
    name: iOS AltStore PAL build
    needs: draft-release
    uses: ./.github/workflows/ios-altstore-pal.yml
    with:
      stable_release_tag: ${{ needs.draft-release.outputs.tag_name }}
    secrets: inherit

