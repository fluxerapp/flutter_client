name: iOS Canary TestFlight Build

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    name: Build and upload to TestFlight
    runs-on: macos-26
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Sync submodules
        run: git submodule update --init --recursive

      - name: Detect preinstalled Flutter
        id: detect_flutter
        run: |
          if command -v flutter >/dev/null 2>&1; then
            echo "::notice::Using preinstalled Flutter: $(flutter --version | head -n 1)"
            echo "flutter_installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Flutter not found. Workflow will install it."
            echo "flutter_installed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Flutter
        if: steps.detect_flutter.outputs.flutter_installed != 'true'
        # Temp use while waiting for a pr: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable
      - name: Restore pub cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Strip Firebase dependencies if present
        run: dart run tool/strip_firebase_deps.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create keychain and import certificate
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=actions
          LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          ORIGINAL_DEFAULT_KEYCHAIN="$(security default-keychain -d user 2>/dev/null | tr -d '"' || true)"
          TEMP_KEYCHAIN_WAS_DEFAULT=false
          if [ -z "$ORIGINAL_DEFAULT_KEYCHAIN" ]; then
            TEMP_KEYCHAIN_WAS_DEFAULT=true
          fi
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"
          echo "TEMP_KEYCHAIN_WAS_DEFAULT=$TEMP_KEYCHAIN_WAS_DEFAULT" >> "$GITHUB_ENV"
          if [ -z "$CERTIFICATES_P12" ]; then
            echo "::error::CERTIFICATES_P12 is not set."
            exit 1
          fi
          if [ -z "$CERTIFICATES_P12_PASSWORD" ]; then
            echo "::error::CERTIFICATES_P12_PASSWORD is not set."
            exit 1
          fi
          echo "$CERTIFICATES_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lu -t 3600 "$KEYCHAIN_PATH"
          if [ "$TEMP_KEYCHAIN_WAS_DEFAULT" = "true" ]; then
            security default-keychain -d user -s "$KEYCHAIN_PATH"
          fi
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATES_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          if [ -f "$LOGIN_KEYCHAIN" ]; then
            security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN_KEYCHAIN"
          else
            security list-keychains -d user -s "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install provisioning profiles
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.CANARY_PROVISIONING_PROFILE_BASE64 }}
          CANARY_BROADCAST_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.CANARY_BROADCAST_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
          CANARY_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64: ${{ secrets.CANARY_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          for existing_profile in "$PROFILES_DIR"/*.mobileprovision; do
            [ -e "$existing_profile" ] || continue
            PROFILE_APP_ID=$(security cms -D -i "$existing_profile" | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || true)
            case "$PROFILE_APP_ID" in
              *.com.fluxer|*.com.fluxer.canary|*.com.fluxer.BroadcastExtension|*.com.fluxer.canary.BroadcastExtension|*.com.fluxer.NotificationService|*.com.fluxer.canary.NotificationService)
                rm -f "$existing_profile"
                ;;
            esac
          done
          if [ -z "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::CANARY_PROVISIONING_PROFILE_BASE64 is not set. Add the base64-encoded App Store profile for the canary app."
            exit 1
          fi
          if [ -z "$CANARY_BROADCAST_EXTENSION_PROVISIONING_PROFILE_BASE64" ]; then
            echo "::error::CANARY_BROADCAST_EXTENSION_PROVISIONING_PROFILE_BASE64 is not set. Add the base64-encoded App Store profile for com.fluxer.canary.BroadcastExtension."
            exit 1
          fi
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/profile.mobileprovision"
          echo "$CANARY_BROADCAST_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/broadcast_extension.mobileprovision"
          if [ -n "$CANARY_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$CANARY_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/notification_service.mobileprovision"
          else
            cp "$PROFILES_DIR/broadcast_extension.mobileprovision" "$PROFILES_DIR/notification_service.mobileprovision"
          fi
          PROFILE_UUID=$(security cms -D -i "$PROFILES_DIR/profile.mobileprovision" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILES_DIR/profile.mobileprovision" | plutil -extract Name raw -)
          PROFILE_TEAM_ID=$(security cms -D -i "$PROFILES_DIR/profile.mobileprovision" | plutil -extract TeamIdentifier.0 raw -)
          IS_DEVELOPMENT_PROFILE=$(security cms -D -i "$PROFILES_DIR/profile.mobileprovision" | plutil -extract Entitlements.get-task-allow raw - 2>/dev/null || echo "false")
          BROADCAST_EXTENSION_PROFILE_UUID=$(security cms -D -i "$PROFILES_DIR/broadcast_extension.mobileprovision" | plutil -extract UUID raw -)
          BROADCAST_EXTENSION_PROFILE_NAME=$(security cms -D -i "$PROFILES_DIR/broadcast_extension.mobileprovision" | plutil -extract Name raw -)
          IS_BROADCAST_EXTENSION_DEVELOPMENT_PROFILE=$(security cms -D -i "$PROFILES_DIR/broadcast_extension.mobileprovision" | plutil -extract Entitlements.get-task-allow raw - 2>/dev/null || echo "false")
          NOTIFICATION_SERVICE_PROFILE_UUID=$(security cms -D -i "$PROFILES_DIR/notification_service.mobileprovision" | plutil -extract UUID raw -)
          NOTIFICATION_SERVICE_PROFILE_NAME=$(security cms -D -i "$PROFILES_DIR/notification_service.mobileprovision" | plutil -extract Name raw -)
          IS_NOTIFICATION_SERVICE_DEVELOPMENT_PROFILE=$(security cms -D -i "$PROFILES_DIR/notification_service.mobileprovision" | plutil -extract Entitlements.get-task-allow raw - 2>/dev/null || echo "false")
          {
            echo "PROFILE_UUID=$PROFILE_UUID"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID"
            echo "BROADCAST_EXTENSION_PROFILE_UUID=$BROADCAST_EXTENSION_PROFILE_UUID"
            echo "NOTIFICATION_SERVICE_PROFILE_UUID=$NOTIFICATION_SERVICE_PROFILE_UUID"
          } >> "$GITHUB_ENV"
          echo "::notice::Provisioning profile metadata - name: $PROFILE_NAME, uuid: $PROFILE_UUID, team: $PROFILE_TEAM_ID, development: $IS_DEVELOPMENT_PROFILE"
          echo "::notice::Broadcast extension profile metadata - name: $BROADCAST_EXTENSION_PROFILE_NAME, uuid: $BROADCAST_EXTENSION_PROFILE_UUID, development: $IS_BROADCAST_EXTENSION_DEVELOPMENT_PROFILE"
          echo "::notice::Notification Service extension profile metadata - name: $NOTIFICATION_SERVICE_PROFILE_NAME, uuid: $NOTIFICATION_SERVICE_PROFILE_UUID, development: $IS_NOTIFICATION_SERVICE_DEVELOPMENT_PROFILE"
          if [ "$IS_DEVELOPMENT_PROFILE" = "true" ]; then
            echo "::error::Provisioning profile is Development type. Use an App Store distribution profile for TestFlight."
            exit 1
          fi
          if [ "$IS_BROADCAST_EXTENSION_DEVELOPMENT_PROFILE" = "true" ]; then
            echo "::error::Broadcast extension provisioning profile is Development type. Use an App Store distribution profile for TestFlight."
            exit 1
          fi
          if [ "$IS_NOTIFICATION_SERVICE_DEVELOPMENT_PROFILE" = "true" ]; then
            echo "::error::Notification Service extension provisioning profile is Development type. Use an App Store distribution profile for TestFlight."
            exit 1
          fi

      - name: Detect preinstalled Ruby
        id: detect_ruby
        run: |
          REQUIRED_RUBY_VERSION="4.0"
          if ! command -v ruby >/dev/null 2>&1; then
            echo "::notice::Ruby not found. Workflow will install Ruby ${REQUIRED_RUBY_VERSION}."
            echo "ruby_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT_RUBY_VERSION="$(ruby -e 'print RUBY_VERSION')"
          case "$CURRENT_RUBY_VERSION" in
            ${REQUIRED_RUBY_VERSION}.*)
              echo "::notice::Using preinstalled Ruby ${CURRENT_RUBY_VERSION}."
              echo "ruby_ready=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::Found Ruby ${CURRENT_RUBY_VERSION}; requires ${REQUIRED_RUBY_VERSION}.x. Workflow will install required version."
              echo "ruby_ready=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Set up Ruby
        if: steps.detect_ruby.outputs.ruby_ready != 'true'
        uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5
        with:
          ruby-version: "4.0"
      - name: Restore Bundler cache
        if: runner.environment != 'self-hosted'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundler-ruby-4.0-${{ hashFiles('Gemfile.lock', 'Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-bundler-ruby-4.0-
      - name: Install Ruby gems
        run: |
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Build and upload with Fastlane
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          MEASURE_API_KEY: ${{ secrets.MEASURE_API_KEY }}
          MEASURE_API_URL: ${{ secrets.MEASURE_API_URL }}
        run: bundle exec fastlane ios testflight_canary
      - name: Cleanup temporary keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          if [ "${TEMP_KEYCHAIN_WAS_DEFAULT:-false}" = "true" ] && [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          elif [ "${TEMP_KEYCHAIN_WAS_DEFAULT:-false}" = "true" ] && [ -f "$LOGIN_KEYCHAIN" ]; then
            security default-keychain -d user -s "$LOGIN_KEYCHAIN" || true
          fi
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security list-keychains -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          elif [ -f "$LOGIN_KEYCHAIN" ]; then
            security list-keychains -d user -s "$LOGIN_KEYCHAIN" || true
          fi
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [ -f "$LOGIN_KEYCHAIN" ]; then
            security default-keychain -d user -s "$LOGIN_KEYCHAIN" || true
            security list-keychains -d user -s "$LOGIN_KEYCHAIN" || true
          fi
