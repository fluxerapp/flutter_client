name: Release Drafter

on:
  push:
    branches:
      - beta
      - stable

permissions:
  contents: write
  pull-requests: read

jobs:
  update_beta_draft:
    name: Update beta release draft
    if: github.ref == 'refs/heads/beta'
    uses: ./.github/workflows/_draft-beta-release.yml
    secrets: inherit

  update_stable_draft:
    name: Update stable release draft
    if: github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - id: release_drafter
        uses: release-drafter/release-drafter@693d20e7c1ce1a81d3a41962f85914253b518449
        with:
          config-name: release-drafter-stable.yml
          token: ${{ secrets.FLUXER_AUTOMATION_PAT }}
          commitish: stable

      - name: Append contributor avatars
        env:
          RELEASE_ID: ${{ steps.release_drafter.outputs.id }}
          BODY: ${{ steps.release_drafter.outputs.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' "$BODY" > /tmp/release-body.md
          python3 .github/scripts/append_release_contributor_avatars.py /tmp/release-body.md
