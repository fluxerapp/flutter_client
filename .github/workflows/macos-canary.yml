name: macOS Canary Build (Velopack)

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number appended to the version (defaults to the run number)
        required: false
        type: string
  workflow_call:
    inputs:
      build_number:
        description: Build number appended to the version (defaults to the run number)
        required: false
        type: string
    outputs:
      version:
        description: Velopack package version
        value: ${{ jobs.build-and-pack.outputs.version }}

permissions:
  contents: read

env:
  OXYGEN_CHANNEL: canary
  OXYGEN_PACK_ID: com.fluxer.oxygen.canary
  OXYGEN_APP_NAME: Fluxer Oxygen
  OXYGEN_FEED_BASE_URL: https://pkgs.fluxer.com/oxygen/canary/darwin
  VPK_VERSION: 1.2.161

jobs:
  build-and-pack:
    name: Build, sign and pack canary macOS app
    runs-on: macos-26
    environment: release-builds
    outputs:
      version: ${{ steps.version.outputs.pack_version }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Sync submodules
        run: git submodule update --init --recursive

      - name: Resolve version
        id: version
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          python3 .github/scripts/app_version.py read
          BUILD_NUMBER="${INPUT_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid build number: $BUILD_NUMBER"
            exit 1
          fi
          VERSION_NAME="$(grep '^release_drafter_version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)"
          {
            echo "build_number=$BUILD_NUMBER"
            echo "pack_version=$VERSION_NAME-canary.$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        # Temp use while waiting for a pr: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable
          flutter-version: 3.47.9

      - name: Set up Rust and native asset build hooks
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            . "$HOME/.cargo/env"
          fi
          rustup show active-toolchain || rustup toolchain install stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          flutter config --enable-native-assets

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: 9.0.x

      - name: Install vpk
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Configure OSS build tree
        run: dart tool/configure_build.dart --profile=oss

      - name: Apply macOS dependency overrides
        run: bash tool/apply_macos_pub_overrides.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Generate Xcode configuration
        env:
          VERSION_NAME: ${{ steps.version.outputs.release_drafter_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          flutter build macos --config-only --release --flavor canary \
            --build-name "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER" \
            --dart-define-from-file=tool/dart_defines/canary.json \
            --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --dart-define=CANARY_NUMBER="$BUILD_NUMBER"

      - name: Build unsigned universal app
        run: |
          xcodebuild \
            -workspace macos/Runner.xcworkspace \
            -scheme canary \
            -configuration Release-canary \
            -derivedDataPath build/macos-direct \
            -destination 'generic/platform=macOS' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            build
          APP_DIR="build/macos-direct/Build/Products/Release-canary"
          APP_PATH="$APP_DIR/$OXYGEN_APP_NAME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected app bundle at $APP_PATH"
            exit 1
          fi
          lipo -info "$APP_PATH/Contents/MacOS/$OXYGEN_APP_NAME"
          echo "APP_PATH=$GITHUB_WORKSPACE/$APP_PATH" >> "$GITHUB_ENV"

      - name: Create keychain and import Developer ID certificates
        env:
          DEVELOPER_ID_APPLICATION_P12: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          DEVELOPER_ID_INSTALLER_P12: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12 }}
          DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
        run: |
          for name in DEVELOPER_ID_APPLICATION_P12 DEVELOPER_ID_APPLICATION_P12_PASSWORD DEVELOPER_ID_INSTALLER_P12; do
            if [ -z "${!name}" ]; then
              echo "::error::MACOS_$name is not set."
              exit 1
            fi
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/velopack.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$DEVELOPER_ID_APPLICATION_P12" | base64 --decode > "$RUNNER_TEMP/developer_id_application.p12"
          security import "$RUNNER_TEMP/developer_id_application.p12" -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild -T /usr/bin/productsign
          echo "$DEVELOPER_ID_INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/developer_id_installer.p12"
          security import "$RUNNER_TEMP/developer_id_installer.p12" -k "$KEYCHAIN_PATH" \
            -P "${DEVELOPER_ID_INSTALLER_P12_PASSWORD:-$DEVELOPER_ID_APPLICATION_P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild -T /usr/bin/productsign
          rm -f "$RUNNER_TEMP/developer_id_application.p12" "$RUNNER_TEMP/developer_id_installer.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          if [ -f "$LOGIN_KEYCHAIN" ]; then
            security list-keychains -d user -s "$KEYCHAIN_PATH" "$LOGIN_KEYCHAIN"
          else
            security list-keychains -d user -s "$KEYCHAIN_PATH"
          fi
          ORIGINAL_DEFAULT_KEYCHAIN="$(security default-keychain -d user 2>/dev/null | tr -d '" ' || true)"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"
          APP_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -1)"
          if [ -z "$APP_IDENTITY" ] || [ -z "$INSTALLER_IDENTITY" ]; then
            echo "::error::Developer ID Application or Installer identity not found in imported certificates."
            security find-identity -v "$KEYCHAIN_PATH"
            exit 1
          fi
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "APP_IDENTITY=$APP_IDENTITY"
            echo "INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Prepare entitlements and provisioning profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.CANARY_MACOS_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_TEAM_ID is not set."
            exit 1
          fi
          ENTITLEMENTS="$RUNNER_TEMP/direct.entitlements"
          cp macos/Runner/Release.entitlements "$ENTITLEMENTS"
          plutil -remove com\\.apple\\.security\\.app-sandbox "$ENTITLEMENTS"
          if [ -n "$PROVISIONING_PROFILE_BASE64" ]; then
            PROFILE_PATH="$RUNNER_TEMP/direct.provisionprofile"
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            PROFILE_APP_ID="$(security cms -D -i "$PROFILE_PATH" | plutil -extract Entitlements.com\\.apple\\.application-identifier raw - 2>/dev/null || true)"
            if [ "$PROFILE_APP_ID" != "$APPLE_TEAM_ID.$OXYGEN_PACK_ID" ]; then
              echo "::error::Provisioning profile is for '$PROFILE_APP_ID', expected '$APPLE_TEAM_ID.$OXYGEN_PACK_ID'."
              exit 1
            fi
            plutil -replace keychain-access-groups -json "[\"$APPLE_TEAM_ID.com.fluxer\"]" "$ENTITLEMENTS"
            plutil -replace com\\.apple\\.application-identifier -string "$APPLE_TEAM_ID.$OXYGEN_PACK_ID" "$ENTITLEMENTS"
            plutil -replace com\\.apple\\.developer\\.team-identifier -string "$APPLE_TEAM_ID" "$ENTITLEMENTS"
            cp "$PROFILE_PATH" "$APP_PATH/Contents/embedded.provisionprofile"
          else
            echo "::warning::CANARY_MACOS_DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 is not set; signing without push, app group and keychain sharing entitlements."
            plutil -remove com\\.apple\\.developer\\.aps-environment "$ENTITLEMENTS"
            plutil -remove com\\.apple\\.security\\.application-groups "$ENTITLEMENTS"
            plutil -remove keychain-access-groups "$ENTITLEMENTS"
          fi
          plutil -lint "$ENTITLEMENTS"
          plutil -p "$ENTITLEMENTS"
          echo "ENTITLEMENTS_PATH=$ENTITLEMENTS" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$APPSTORE_KEY_ID.p8"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          xcrun notarytool store-credentials fluxer-oxygen-notary \
            --key "$KEY_PATH" \
            --key-id "$APPSTORE_KEY_ID" \
            --issuer "$APPSTORE_ISSUER_ID" \
            --keychain "$KEYCHAIN_PATH"
          rm -f "$KEY_PATH"

      - name: Sign nested frameworks
        run: |
          FRAMEWORKS_DIR="$APP_PATH/Contents/Frameworks"
          find "$FRAMEWORKS_DIR" -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -print0 \
            | while IFS= read -r -d '' item; do
                codesign --force --timestamp --options runtime --sign "$APP_IDENTITY" --keychain "$KEYCHAIN_PATH" "$item"
              done
          codesign --verify --strict --verbose=1 "$FRAMEWORKS_DIR"/*.framework "$FRAMEWORKS_DIR"/*.dylib

      - name: Download previous release for delta packages
        run: |
          mkdir -p Releases
          if ! vpk download http --url "$OXYGEN_FEED_BASE_URL/arm64" --channel "$OXYGEN_CHANNEL" --outputDir Releases --allowEmptyChannel; then
            echo "::notice::No previous release found at $OXYGEN_FEED_BASE_URL/arm64; packing without deltas."
          fi

      - name: Pack, sign and notarize with Velopack
        env:
          PACK_VERSION: ${{ steps.version.outputs.pack_version }}
        run: |
          touch "$RUNNER_TEMP/vpk-pack.marker"
          sleep 1
          vpk pack \
            --packId "$OXYGEN_PACK_ID" \
            --packVersion "$PACK_VERSION" \
            --packDir "$APP_PATH" \
            --packTitle "$OXYGEN_APP_NAME Canary" \
            --mainExe "$OXYGEN_APP_NAME" \
            --channel "$OXYGEN_CHANNEL" \
            --outputDir Releases \
            --signAppIdentity "$APP_IDENTITY" \
            --signInstallIdentity "$INSTALLER_IDENTITY" \
            --signEntitlements "$ENTITLEMENTS_PATH" \
            --signDisableDeep \
            --notaryProfile fluxer-oxygen-notary

      - name: Verify packaged app and updater launch
        run: |
          VERIFY_DIR="$RUNNER_TEMP/vpk-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          PORTABLE_ZIP="$(find Releases -maxdepth 1 -name '*-Portable.zip' -newer "$RUNNER_TEMP/vpk-pack.marker" | head -1)"
          ditto -x -k "$PORTABLE_ZIP" "$VERIFY_DIR"
          VERIFY_APP="$(find "$VERIFY_DIR" -maxdepth 1 -name '*.app' | head -1)"
          codesign --verify --deep --strict --verbose=1 "$VERIFY_APP"
          spctl -a -vv "$VERIFY_APP"
          echo "UpdateMac entitlements:"
          codesign -d --entitlements - "$VERIFY_APP/Contents/MacOS/UpdateMac" 2>/dev/null || true
          set +e
          "$VERIFY_APP/Contents/MacOS/UpdateMac" --help >/dev/null 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ge 128 ]; then
            echo "::error::UpdateMac was killed on launch (exit $STATUS); its code signature or entitlements are invalid."
            exit 1
          fi

      - name: Lay out release feed
        run: |
          FEED_DIR="feed/oxygen/$OXYGEN_CHANNEL/darwin"
          mkdir -p "$FEED_DIR/arm64" "$FEED_DIR/x64"
          find Releases -maxdepth 1 -type f -newer "$RUNNER_TEMP/vpk-pack.marker" -print0 \
            | while IFS= read -r -d '' file; do
                cp "$file" "$FEED_DIR/arm64/"
                cp "$file" "$FEED_DIR/x64/"
              done
          ls -la "$FEED_DIR/arm64"

      - name: Upload release feed artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: oxygen-canary-darwin
          path: feed
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keychain
        if: always()
        run: |
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -d user -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/direct.provisionprofile"
