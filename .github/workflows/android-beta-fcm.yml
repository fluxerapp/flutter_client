name: Android Beta FCM Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-beta:
    name: Build beta APK
    runs-on: macos-26
    environment: release-builds
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event_name == 'workflow_call' && 'beta' || github.ref }}
          submodules: recursive

      - name: Resolve beta version name
        id: beta_version_name
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve_beta_version_name.sh

      - name: Fetch Android build number
        id: android_build_number
        env:
          BUILD_SERVICE_TOKEN: ${{ secrets.BUILD_SERVICE_TOKEN }}
          BUILD_SERVICE_URL: ${{ secrets.BUILD_SERVICE_URL }}
        run: |
          set -euo pipefail
          URL="https://$BUILD_SERVICE_URL/v1/build-number?platform=android"
          echo "Calling build service at $URL"
          RESPONSE=$(curl -sS -X POST "$URL" \
            -H "Authorization: Bearer $BUILD_SERVICE_TOKEN")
          RESPONSE_ONE_LINE=$(printf '%s' "$RESPONSE" | tr -d '\n')
          BUILD_NUMBER=$(printf '%s\n' "$RESPONSE_ONE_LINE" | sed -n 's/.*"buildNumber"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p')
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid or missing buildNumber in response: $RESPONSE"
            exit 1
          fi
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Sync submodules
        run: git submodule update --init --recursive

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore Gradle cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up Flutter
        # Temp use while waiting for a pr: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable
      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Merge Firebase dependencies
        run: dart tool/merge_firebase_deps.dart

      - name: Write firebase_options.dart
        env:
          FIREBASE_OPTIONS_JSON: ${{ secrets.FIREBASE_OPTIONS_JSON }}
        run: dart tool/write_firebase_options.dart --environment=beta

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build

      - name: Create Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties << EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Write Android ADI registration file
        env:
          ANDROID_ADI_REGISTRATION_SNIPPET: ${{ secrets.ANDROID_ADI_REGISTRATION_SNIPPET }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_ADI_REGISTRATION_SNIPPET" ]; then
            echo "::warning::ANDROID_ADI_REGISTRATION_SNIPPET secret is not set. Add the Play Console identifier under Settings -> Secrets and variables -> Actions -> Secrets if you need adi-registration.properties in the APK."
            exit 0
          fi
          mkdir -p android/app/src/main/assets
          printf '%s\n' "$ANDROID_ADI_REGISTRATION_SNIPPET" > android/app/src/main/assets/adi-registration.properties

      - name: Configure Google services for beta
        env:
          GOOGLE_SERVICES_JSON_ANDROID: ${{ secrets.GOOGLE_SERVICES_JSON_ANDROID }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_ANDROID" ]; then
            echo "$GOOGLE_SERVICES_JSON_ANDROID" > android/app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON_ANDROID secret is not set. Existing android/app/google-services.json will be used."
          fi

      - name: Build beta split APKs
        run: flutter build apk --release --split-per-abi --flavor betaFcm --build-name ${{ steps.beta_version_name.outputs.version_name }} --build-number ${{ steps.android_build_number.outputs.build_number }} --dart-define-from-file=tool/dart_defines/beta.json --dart-define=PUSH_PROVIDER=fcm --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --dart-define=BETA_NUMBER=${{ steps.beta_version_name.outputs.beta_number }}

      - name: Build beta combined APK
        run: flutter build apk --release --flavor betaFcm --build-name ${{ steps.beta_version_name.outputs.version_name }} --build-number ${{ steps.android_build_number.outputs.build_number }} --dart-define-from-file=tool/dart_defines/beta.json --dart-define=PUSH_PROVIDER=fcm --dart-define=BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" --dart-define=BETA_NUMBER=${{ steps.beta_version_name.outputs.beta_number }}

      - name: Upload beta APK artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: beta-fcm-apk
          path: |
            build/app/outputs/flutter-apk/app-*-betafcm-release.apk
            build/app/outputs/flutter-apk/app-betafcm-release.apk
          if-no-files-found: error
