name: iOS Stable Release

on:
  workflow_dispatch:

jobs:
  check-actor:
    name: Check allowed user
    runs-on: self-hosted
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check actor against allowlist
        id: check
        run: |
          ALLOWED="${{ vars.ALLOWED_PRODUCTION_RELEASE_ACTORS }}"
          if [ -z "$ALLOWED" ]; then
            echo "::error::Repository variable ALLOWED_PRODUCTION_RELEASE_ACTORS is not set. Add a comma-separated list of GitHub usernames in Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          ACTOR="${{ github.actor }}"
          ALLOWED_ARR="${ALLOWED//,/ }"
          FOUND=false
          for u in $ALLOWED_ARR; do
            u_trimmed=$(echo "$u" | xargs)
            if [ "$u_trimmed" = "$ACTOR" ]; then
              FOUND=true
              break
            fi
          done
          if [ "$FOUND" != "true" ]; then
            echo "::error::User $ACTOR is not allowed to run this workflow. Allowed users are listed in ALLOWED_PRODUCTION_RELEASE_ACTORS."
            exit 1
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"

  build-and-upload:
    name: Build stable and upload to App Store Connect
    needs: check-actor
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Sync submodules
        run: git submodule update --init --recursive

      - name: Set up Flutter
        # Temp use while waiting for a pr: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable
      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create keychain and import certificate
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATES_P12_PASSWORD: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=actions
          echo "$CERTIFICATES_P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lu -t 3600 $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH -P "$CERTIFICATES_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          rm -f $RUNNER_TEMP/cert.p12

      - name: Install provisioning profiles
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          BROADCAST_EXTENSION_PROVISIONING_PROFILE_BASE64: ${{ secrets.BROADCAST_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/profile.mobileprovision"
          if [ -n "$BROADCAST_EXTENSION_PROVISIONING_PROFILE_BASE64" ]; then
            echo "$BROADCAST_EXTENSION_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/broadcast_extension.mobileprovision"
          else
            cp "$PROFILES_DIR/profile.mobileprovision" "$PROFILES_DIR/broadcast_extension.mobileprovision"
          fi
          PROFILE_UUID=$(security cms -D -i "$PROFILES_DIR/profile.mobileprovision" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILES_DIR/profile.mobileprovision" | plutil -extract Name raw -)
          PROFILE_TEAM_ID=$(security cms -D -i "$PROFILES_DIR/profile.mobileprovision" | plutil -extract TeamIdentifier.0 raw -)
          IS_DEVELOPMENT_PROFILE=$(security cms -D -i "$PROFILES_DIR/profile.mobileprovision" | plutil -extract Entitlements.get-task-allow raw - 2>/dev/null || echo "false")
          BROADCAST_EXTENSION_PROFILE_UUID=$(security cms -D -i "$PROFILES_DIR/broadcast_extension.mobileprovision" | plutil -extract UUID raw -)
          BROADCAST_EXTENSION_PROFILE_NAME=$(security cms -D -i "$PROFILES_DIR/broadcast_extension.mobileprovision" | plutil -extract Name raw -)
          IS_BROADCAST_EXTENSION_DEVELOPMENT_PROFILE=$(security cms -D -i "$PROFILES_DIR/broadcast_extension.mobileprovision" | plutil -extract Entitlements.get-task-allow raw - 2>/dev/null || echo "false")
          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV
          echo "PROFILE_TEAM_ID=$PROFILE_TEAM_ID" >> $GITHUB_ENV
          echo "BROADCAST_EXTENSION_PROFILE_UUID=$BROADCAST_EXTENSION_PROFILE_UUID" >> $GITHUB_ENV
          echo "::notice::Provisioning profile metadata - name: $PROFILE_NAME, uuid: $PROFILE_UUID, team: $PROFILE_TEAM_ID, development: $IS_DEVELOPMENT_PROFILE"
          echo "::notice::Broadcast extension profile metadata - name: $BROADCAST_EXTENSION_PROFILE_NAME, uuid: $BROADCAST_EXTENSION_PROFILE_UUID, development: $IS_BROADCAST_EXTENSION_DEVELOPMENT_PROFILE"
          if [ "$IS_DEVELOPMENT_PROFILE" = "true" ]; then
            echo "::error::Provisioning profile is Development type. Use an App Store distribution profile."
            exit 1
          fi
          if [ "$IS_BROADCAST_EXTENSION_DEVELOPMENT_PROFILE" = "true" ]; then
            echo "::error::Broadcast extension provisioning profile is Development type. Use an App Store distribution profile."
            exit 1
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@4c56a21280b36d862b5fc31348f463d60bdc55d5
        with:
          ruby-version: "3.4"
      - name: Restore Bundler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-bundler-${{ hashFiles('Gemfile.lock', 'Gemfile') }}
          restore-keys: |
            ${{ runner.os }}-bundler-
      - name: Install Ruby gems
        run: |
          bundle config set path 'vendor/bundle'
          bundle install --jobs 4 --retry 3

      - name: Build and upload with Fastlane
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: bundle exec fastlane ios stable_release
