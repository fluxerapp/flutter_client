# SPDX-License-Identifier: AGPL-3.0-or-later
name: Calendar version

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BASE_BRANCH: canary

jobs:
  roll:
    name: Roll year.month
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Create token
        id: create-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.FLUXER_CI_APP_ID }}
          private-key: ${{ secrets.FLUXER_CI_APP_KEY }}
          owner: fluxerapp
          repositories: flutter_client
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          token: ${{ steps.create-token.outputs.token }}
          ref: ${{ env.BASE_BRANCH }}

      - name: Roll pubspec calendar
        id: roll
        run: python3 .github/scripts/app_version.py roll

      - name: Commit version bump
        env:
          NEW_VERSION: ${{ steps.roll.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "fluxer-ci[bot]"
          git config user.email "${{ vars.FLUXER_CI_APP_USER_ID }}+fluxer-ci[bot]@users.noreply.github.com"

          if git diff --quiet -- pubspec.yaml; then
            echo "::notice::year.month already current; nothing to do."
            exit 0
          fi

          git add pubspec.yaml
          git commit -m "chore(version): roll calendar to ${NEW_VERSION}"
          git pull --rebase origin "$BASE_BRANCH"
          git push origin "HEAD:$BASE_BRANCH"
