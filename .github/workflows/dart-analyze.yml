# separate terms of service, privacy policy, and support
# documentation.

name: Dart analyze

on:
  push:
    branches:
      - canary
    paths:
      - "**/*.dart"
  pull_request:
    branches:
      - canary

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          submodules: recursive

      - name: Set up Flutter
        # Temp use while waiting for a pr: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        uses: axi92/flutter-action@72633a794ba0b23276fa4fc465a6cacb758a90c5
        with:
          channel: stable
      - name: Restore pub cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Strip Firebase dependencies if present
        run: dart run tool/strip_firebase_deps.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Verify generated localizations
        run: |
          flutter gen-l10n
          dart format lib/l10n/generated
          git diff --exit-code -- lib/l10n/generated

      - name: Run code generation
        run: dart run build_runner build

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Run package tests
        run: |
          for package in packages/*; do
            if [ -d "$package/test" ]; then
              (cd "$package" && flutter pub get && flutter test)
            fi
          done
